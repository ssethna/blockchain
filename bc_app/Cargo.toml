[package]
name = "bc_app"
version = "0.1.0"
edition = "2021"

[dependencies]
mongodb = "3.2.1"
bson = "2.13.0"
tokio = { version = "1.43.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
block_chain = { path = "../block_chain" }
chrono = "0.4"
uuid = { version = "1.13.1", features = ["v4"] }
futures = "0.3.31"
